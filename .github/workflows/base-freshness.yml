name: base freshness diag
on:
  pull_request:
    branches: ['**']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: What did we actually check out?
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "event=${{ github.event_name }} head_sha=${{ github.event.pull_request.head.sha }} base=${{ github.event.pull_request.base.sha }}"
          echo "--- local HEAD"; git rev-parse HEAD; git log --oneline -3
          echo "--- is HEAD the merge commit? (its parents)"; git rev-list --parents -n1 HEAD
          echo "--- origin refs before fetch"; git for-each-ref --format='%(refname) %(objectname)' | grep -i "origin/" | head -5
          git fetch origin "$BASE_REF" --depth=1
          echo "--- after fetch: origin/$BASE_REF = $(git rev-parse origin/$BASE_REF)"
          echo "--- base ref tip (API) = ${{ github.event.pull_request.base.sha }}"
          if git merge-base --is-ancestor "origin/$BASE_REF" HEAD; then echo "ANCESTOR=yes"; else echo "ANCESTOR=no"; fi
